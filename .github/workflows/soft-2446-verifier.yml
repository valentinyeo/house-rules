name: SOFT-2446 DeepSeek verifier
on:
  pull_request:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: column-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pstack-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Independent DeepSeek Flash verification
        env:
          OPENCODE_API_KEY: ${{ secrets.PSTACK_OPENCODE_API_KEY || secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERIFY_COMMANDS: '["python3 -m unittest tests.test_workflow_columns tests.test_ticket_ownership tests.test_fleet_reconcile -v", "python3 fleet/pr-merge --self-test", "python3 fleet/sf-release-watch --self-test", "python3 skills/hypertask-triage/scripts/flow-check --self-test"]'
        run: python3 scripts/column-verifier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soft-2446-verifier-trace
          path: ${{ runner.temp }}/column-verifier
          retention-days: 7
