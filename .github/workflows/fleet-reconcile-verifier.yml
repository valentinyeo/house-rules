name: Fleet reconcile verifier
on:
  pull_request:
    paths:
      - fleet/reconcile
      - fleet/lease
      - docs/fleet-reconcile.md
      - house-rules.md
      - systemd/fleet-reconcile-board15.service
      - .github/workflows/fleet-reconcile-verifier.yml
permissions:
  contents: read
  pull-requests: write
jobs:
  reconcile-verifier:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: change
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cursor/plugins
          ref: e1cc03121a0e71129a4fb730d7c5528a0a3e43c8
          path: pstack-source
          persist-credentials: false
      - name: Install the vstack skill the shim execs
        run: git clone --depth 1 https://github.com/valentinyeo/vstack "$HOME/.local/share/vstack"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: picker-base
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Prove both shims
        working-directory: change
        run: |
          fleet/reconcile --self-test
          export FLEET_LEASE_DIR="$RUNNER_TEMP/leases"
          fleet/lease SOFT-1 run -- true
          test ! -e "$FLEET_LEASE_DIR/SOFT-1.json"
      - name: Verifier challenges the reconciliation fix
        working-directory: change
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -o pipefail
          test -n "$OPENCODE_API_KEY"
          model=$(python3 -I "$GITHUB_WORKSPACE/picker-base/scripts/pick-verifier-model") && echo "VERIFIER_MODEL=$model" >> "$GITHUB_ENV" && pi --provider opencode-go --model "$model" --thinking low \
            --no-extensions --no-mcp --no-skills --no-context-files \
            --no-prompt-templates --no-themes --tools read,bash \
            --no-session --mode json -p \
            'Read '"$GITHUB_WORKSPACE"'/pstack-source/pstack/skills/poteto-mode/worker.md before anything else.
          Goal: the board sync script and its tests move to the hypertask-work skill in valentinyeo/vstack. House-rules keeps only a three-line shim for fleet/reconcile and fleet/lease, plus one pointer in house-rules.md and docs/fleet-reconcile.md. Independently challenge this PR head.
          The vstack copy is installed at $HOME/.local/share/vstack. Run python3 -m unittest tests.test_hypertask_work -v there. Run fleet/reconcile --self-test through the shim. Exercise the shim with --board 2060 as a dry run if credentials allow; never run --apply.
          Prove a running process with a lease reads live, and a dead pid reads not live. Prove the shim forwards arguments and exit codes. Prove no second copy of the board columns, lease rules, board 15 rules or timer remains in house-rules.
          Board 2060 behavior must remain unchanged. Board 15 uses HTPR keys and only hypertask-ai/hypertask PRs. Live workers take priority. Never move into Valentin Review or Done. Keep the two-hour grace and five-move cap. Board15 writes require vcc or HT Product Lead, never personal credentials.
          Read the complete changed files and git diff origin/main. Do not edit tracked files or merge. No live board credentials exist on this runner. Inspect new comments under pstack no-comments.
          End with one verdict line PASS, PASS+NOTES, or FAIL, followed by exact evidence and any user-visible bugs. Keep prose sentences at most eight words. Commands and logs stay exact. Delete any lease file your checks create.' \
            > verifier.jsonl
      - run: git -C change diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-fleet-reconcile-trace
          path: change/verifier.jsonl
      - name: Post the independent verdict
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const events = fs.readFileSync('change/verifier.jsonl', 'utf8').split('\n').filter(Boolean).map(x => JSON.parse(x));
            const messages = events.filter(x => x.type === 'message_end' && x.message?.role === 'assistant');
            const last = messages.at(-1)?.message?.content || [];
            const verdict = last.filter(x => x.type === 'text').map(x => x.text).join('\n');
            const match = verdict.match(/^(PASS\+NOTES|PASS|FAIL)\s*$/m);
            if (!match) throw new Error('Verifier returned no verdict');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${verdict}\n\nVerifier model: ${process.env.VERIFIER_MODEL}. Head ${context.payload.pull_request.head.sha}.\nTrace: ${run}`;
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            if (match[1] === 'FAIL') core.setFailed('Verifier verdict FAIL');
