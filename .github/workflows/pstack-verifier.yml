name: pstack verifier

# pull_request only. The head checkout must not run with a token that can write.
# The judge is scripts/verifier from the base commit. The head copy is used only when the base
# commit has none (the pull request that adds this workflow).
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pstack-verifier-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pstack-verifier:
    name: pstack-verifier
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fail closed for a fork
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          printf 'pstack-verifier: FAIL @ %s\n\nReason: this pull request comes from a fork, and the model login is not available.\n' "$HEAD_SHA" > "$RUNNER_TEMP/fork-comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/fork-comment.md"
          exit 1

      - name: Check out the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: parent
          persist-credentials: false

      - name: Check out the head commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Take the verifier from the base commit
        run: |
          set -euo pipefail
          if [ -f parent/scripts/verifier/run.py ] && [ -f parent/scripts/verifier/brief.md ]; then
            echo "VERIFIER_DIR=$GITHUB_WORKSPACE/parent/scripts/verifier" >> "$GITHUB_ENV"
            echo "VERIFIER_SOURCE=base" >> "$GITHUB_ENV"
            echo "Verifier scripts and brief: base commit." >> "$GITHUB_STEP_SUMMARY"
          elif [ -f head/scripts/verifier/run.py ] && [ -f head/scripts/verifier/brief.md ]; then
            echo "VERIFIER_DIR=$GITHUB_WORKSPACE/head/scripts/verifier" >> "$GITHUB_ENV"
            echo "VERIFIER_SOURCE=head" >> "$GITHUB_ENV"
            echo "Bootstrap run: the base commit has no verifier, so this run uses the head commit's scripts and brief." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Neither commit has scripts/verifier." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run the pstack verifier
        timeout-minutes: 25
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_DIR: ${{ github.workspace }}/head
          PSTACK_SCRATCH: ${{ runner.temp }}/pstack
          PYTHONUNBUFFERED: "1"
        run: python3 "$VERIFIER_DIR/run.py"

      - name: Fail closed when no verdict comment was posted
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PSTACK_SCRATCH: ${{ runner.temp }}/pstack
          VERIFIER_DIR: ${{ github.workspace }}/head/scripts/verifier
        run: |
          set -euo pipefail
          dir="${VERIFIER_DIR}"
          if [ -f parent/scripts/verifier/run.py ]; then
            dir="$GITHUB_WORKSPACE/parent/scripts/verifier"
          fi
          python3 "$dir/run.py" --ensure-comment
