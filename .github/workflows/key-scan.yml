name: key-scan
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  key-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout the shared scanner for a calling repo
        if: github.event_name == 'workflow_call' && github.repository != 'valentinyeo/house-rules'
        uses: actions/checkout@v4
        with:
          repository: valentinyeo/house-rules
          ref: ${{ github.job_workflow_sha }}
          path: .key-scan

      - name: Install pinned gitleaks and trufflehog
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          tmp=$(mktemp -d)
          curl -sSfL -o "$tmp/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  $tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf "$tmp/gitleaks.tgz" -C "$HOME/.local/bin" gitleaks
          curl -sSfL -o "$tmp/trufflehog.tgz" https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.8/trufflehog_3.99.8_linux_amd64.tar.gz
          echo "7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08  $tmp/trufflehog.tgz" | sha256sum -c -
          tar -xzf "$tmp/trufflehog.tgz" -C "$HOME/.local/bin" trufflehog
          chmod +x "$HOME/.local/bin/gitleaks" "$HOME/.local/bin/trufflehog"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/gitleaks" version
          "$HOME/.local/bin/trufflehog" --version

      - name: Run scanner tests
        run: |
          set -euo pipefail
          if [ -f tests/test_scan_staged.py ]; then
            root=.
          else
            root=.key-scan
          fi
          ( cd "$root" && python3 -m unittest tests/test_scan_staged.py -v )

      - name: Scan lines this pull request adds
        run: |
          set -euo pipefail
          if [ -x bin/scan-staged ]; then
            scan=bin/scan-staged
          else
            scan=.key-scan/bin/scan-staged
          fi
          "$scan" --range "origin/${{ github.base_ref }}...HEAD"
