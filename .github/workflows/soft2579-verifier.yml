name: SOFT-2579 DeepSeek verifier
on:
  push:
    branches: [verify/soft-2579]
permissions:
  contents: read
jobs:
  deepseek:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: driver
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4a667d4
          path: house-rules
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: valentinyeo/vstack
          ref: 5183546
          path: vstack
          fetch-depth: 0
          persist-credentials: false
      - name: Independent DeepSeek Flash verification
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: python3 driver/verification/soft2579.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soft-2579-deepseek-evidence
          path: evidence
          retention-days: 14
