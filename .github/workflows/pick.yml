name: pick
on:
  push:
    branches: [main]
  pull_request:
jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fleet/pick --self-test
      - run: python3 bin/replay-built --self-test
      - run: python3 fleet/runner-state.py --self-test
      - run: python3 fleet/park --self-test
      - run: python3 fleet/tool-gate.py --self-test
      - run: python3 fleet/pr-snapshot --self-test
      - run: python3 fleet/pr-snapshot --self-test --case bad-copy
      - run: python3 fleet/sf-release-watch --self-test
      - run: python3 fleet/solo-wake --self-test
      - run: python3 fleet/roster-announce --self-test
      - run: python3 fleet/roster-check --self-test
      - run: python3 skills/hypertask-triage/scripts/flow-check --self-test
      - run: python3 skills/hypertask-triage/scripts/board-health --self-test
      - run: fleet/runner harness-selftest
      - run: fleet/runner provider-busy-selftest
      - run: fleet/runner reply-cap-selftest
      - run: fleet/runner no-wait-selftest
      - run: fleet/runner ticket-selftest
      - run: fleet/runner fail-rest-selftest
      - run: fleet/runner orphan-selftest
      - run: fleet/runner loop-selftest
      - run: fleet/runner transcript-selftest
      - run: python3 -m unittest tests.test_ticket_ownership -v
      - run: python3 -m unittest tests.test_runner_chat -v
      - run: python3 -m unittest tests.test_rules_drift -v
      - run: python3 -m unittest tests.test_ticket_gate_label -v
      - run: python3 -m unittest tests.test_slo_watch_open_prs -v
