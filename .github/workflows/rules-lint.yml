name: rules-lint
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: rules-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rules-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/rules-lint --self-test
      - run: python3 -m unittest tests.test_house_rules_sync tests.test_ci_budget
      - name: lint what this change adds
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then base="origin/$BASE_REF"; else base="$BEFORE"; fi
          case "$base" in ""|0000000000000000000000000000000000000000) echo "no base, skipping"; exit 0;; esac
          python3 scripts/rules-lint --diff "$base" --head HEAD
