name: pstack-audit-verifier
on:
  pull_request:
    paths:
      - house-rules.md
      - inventory/pstack-0.15.43-audit.md
      - tests/test_pstack_delegation.py
      - .github/workflows/pstack-audit-verifier.yml
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: pstack-audit-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  deepseek-verifier:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: change
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cursor/plugins
          ref: e1cc03121a0e71129a4fb730d7c5528a0a3e43c8
          path: pstack-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Pick verifier model
        working-directory: change
        run: |
          model=$(python3 scripts/pick-verifier-model)
          echo "VERIFIER_MODEL=$model" >> "$GITHUB_ENV"
      - name: Verifier runs the audit independently
        working-directory: change
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -o pipefail
          test -n "$OPENCODE_API_KEY"
          pi --provider opencode-go --model "$VERIFIER_MODEL" --thinking low \
            --no-extensions --no-mcp --no-skills --no-context-files \
            --no-prompt-templates --no-themes --tools read,bash \
            --no-session --mode json -p \
            'Read '"$GITHUB_WORKSPACE"'/pstack-source/pstack/skills/poteto-mode/worker.md before anything else.
          Goal: house-rules.md keeps only rules absent from pstack 0.15.43. A previous verifier run gave 40133c7 PASS+NOTES, confirming every retained and delegated clause. It found an audit link broken after syncing and two missing duplicate patterns. This follow-up fixes those notes. Verify the fixes and the current complete artifact. Do not repeat full-repository lint, already proven to fail identically on base. The requested diff lint is the relevant check. Verify this PR independently. Do not merge or edit tracked files. Read ../pstack-source/pstack/skills/poteto-mode/SKILL.md. Read the diff against origin/main, the complete original and new house-rules.md, and inventory/pstack-0.15.43-audit.md. Compare every removed clause to the actual pinned pstack sources. Challenge retained clauses too. Run python3 -m unittest tests.test_pstack_delegation -v and python3 scripts/rules-lint --diff origin/main. Prove the regression rejects the original house-rules.md using a temporary checkout or restoring the file afterward. Check every local difference survives. End with exactly one verdict line PASS, PASS+NOTES, or FAIL, followed by concrete evidence and any bugs. Keep prose sentences at most eight words. Commands and logs stay exact.' \
            > verifier.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deepseek-pstack-audit-trace
          path: change/verifier.jsonl
      - name: Post the independent verdict
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const events = fs.readFileSync('change/verifier.jsonl', 'utf8').split('\n').filter(Boolean).map(x => JSON.parse(x));
            const messages = events.filter(x => x.type === 'message_end' && x.message?.role === 'assistant');
            const last = messages.at(-1)?.message?.content || [];
            const verdict = last.filter(x => x.type === 'text').map(x => x.text).join('\n');
            const match = verdict.match(/^(PASS\+NOTES|PASS|FAIL)\s*$/m);
            if (!match) throw new Error('Verifier returned no verdict');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${verdict}\n\nVerifier model: ${process.env.VERIFIER_MODEL}. Head ${context.payload.pull_request.head.sha}.\nTrace: ${run}`;
            await github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
            if (match[1] === 'FAIL') core.setFailed('Verifier verdict FAIL');
